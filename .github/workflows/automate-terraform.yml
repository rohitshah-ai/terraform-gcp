name: automate-Terraform

# ==========================================================
# WORKFLOW PERMISSIONS
# ==========================================================
permissions:
  contents: read
  id-token: write
  actions: write

# ==========================================================
# TRIGGERS
# ==========================================================
on:
  # GitHub Actions scheduled workflows support a minimum
  # practical interval of approximately five minutes.
  schedule:
    - cron: "*/5 * * * *"

  # Manual execution from GitHub UI
  workflow_dispatch:
    inputs:
      action:
        description: "Select action"
        required: true
        type: choice
        options:
          - configure
          - apply
          - destroy
        default: configure

      apply_time:
        description: "Apply time (HH:MM IST)"
        required: true
        type: string
        default: "12:30"

      destroy_time:
        description: "Destroy time (HH:MM IST)"
        required: true
        type: string
        default: "22:00"

# Avoid simultaneous Terraform operations
concurrency:
  group: terraform-dev
  cancel-in-progress: false

# ==========================================================
# JOBS
# ==========================================================
jobs:

  # ========================================================
  # CONFIGURE SCHEDULE
  # ========================================================
  configure:
    name: Configure Terraform Schedule

    if: |
      github.event_name == 'workflow_dispatch' &&
      inputs.action == 'configure'

    runs-on: ubuntu-latest

    environment:
      name: dev

    permissions:
      contents: read
      actions: write

    steps:

      # ====================================================
      # CHECKOUT
      # ====================================================
      - name: Checkout
        uses: actions/checkout@v4

      # ====================================================
      # CONVERT IST TO UTC
      # ====================================================
      - name: Convert IST to UTC
        id: convert

        env:
          APPLY_TIME: ${{ inputs.apply_time }}
          DESTROY_TIME: ${{ inputs.destroy_time }}

        shell: bash

        run: |
          set -euo pipefail

          echo "======================================"
          echo "Input Schedule"
          echo "======================================"
          echo "Apply time   : $APPLY_TIME IST"
          echo "Destroy time : $DESTROY_TIME IST"

          # Validate apply time
          if [[ ! "$APPLY_TIME" =~ ^([01][0-9]|2[0-3]):[0-5][0-9]$ ]]; then
            echo "ERROR: Invalid apply time: $APPLY_TIME"
            echo "Expected format: HH:MM"
            echo "Example: 12:30"
            exit 1
          fi

          # Validate destroy time
          if [[ ! "$DESTROY_TIME" =~ ^([01][0-9]|2[0-3]):[0-5][0-9]$ ]]; then
            echo "ERROR: Invalid destroy time: $DESTROY_TIME"
            echo "Expected format: HH:MM"
            echo "Example: 22:00"
            exit 1
          fi

          # Convert IST to UTC
          APPLY_UTC=$(TZ="Asia/Kolkata" date -d "today $APPLY_TIME" -u +"%H:%M")
          DESTROY_UTC=$(TZ="Asia/Kolkata" date -d "today $DESTROY_TIME" -u +"%H:%M")

          # Split apply time
          APPLY_HOUR="${APPLY_UTC:0:2}"
          APPLY_MINUTE="${APPLY_UTC:3:2}"

          # Split destroy time
          DESTROY_HOUR="${DESTROY_UTC:0:2}"
          DESTROY_MINUTE="${DESTROY_UTC:3:2}"

          echo ""
          echo "======================================"
          echo "Terraform Schedule"
          echo "======================================"
          echo "Apply IST    : $APPLY_TIME"
          echo "Apply UTC    : $APPLY_UTC"
          echo ""
          echo "Destroy IST  : $DESTROY_TIME"
          echo "Destroy UTC  : $DESTROY_UTC"
          echo ""
          echo "Days         : Monday-Friday IST"
          echo "======================================"

          {
            echo "apply_hour=$APPLY_HOUR"
            echo "apply_minute=$APPLY_MINUTE"
            echo "destroy_hour=$DESTROY_HOUR"
            echo "destroy_minute=$DESTROY_MINUTE"
          } >> "$GITHUB_OUTPUT"

      # ====================================================
      # SAVE APPLY SCHEDULE
      # ====================================================
      - name: Save Apply Schedule
        env:
          # PAT or GitHub App token with Actions Variables
          # read and write permission
          GH_TOKEN: ${{ secrets.GH_VARIABLE_TOKEN }}

          APPLY_HOUR: ${{ steps.convert.outputs.apply_hour }}
          APPLY_MINUTE: ${{ steps.convert.outputs.apply_minute }}

        shell: bash

        run: |
          set -euo pipefail

          echo "======================================"
          echo "Saving Apply Schedule"
          echo "======================================"

          if [[ -z "$APPLY_HOUR" || -z "$APPLY_MINUTE" ]]; then
            echo "ERROR: Apply schedule output is empty."
            exit 1
          fi

          gh variable set TERRAFORM_APPLY_HOUR \
            --repo "${{ github.repository }}" \
            --body "$APPLY_HOUR"

          gh variable set TERRAFORM_APPLY_MINUTE \
            --repo "${{ github.repository }}" \
            --body "$APPLY_MINUTE"

          echo "Apply schedule saved successfully."
          echo "Apply UTC: $APPLY_HOUR:$APPLY_MINUTE"

      # ====================================================
      # SAVE DESTROY SCHEDULE
      # ====================================================
      - name: Save Destroy Schedule
        env:
          GH_TOKEN: ${{ secrets.GH_VARIABLE_TOKEN }}

          DESTROY_HOUR: ${{ steps.convert.outputs.destroy_hour }}
          DESTROY_MINUTE: ${{ steps.convert.outputs.destroy_minute }}

        shell: bash

        run: |
          set -euo pipefail

          echo "======================================"
          echo "Saving Destroy Schedule"
          echo "======================================"

          if [[ -z "$DESTROY_HOUR" || -z "$DESTROY_MINUTE" ]]; then
            echo "ERROR: Destroy schedule output is empty."
            exit 1
          fi

          gh variable set TERRAFORM_DESTROY_HOUR \
            --repo "${{ github.repository }}" \
            --body "$DESTROY_HOUR"

          gh variable set TERRAFORM_DESTROY_MINUTE \
            --repo "${{ github.repository }}" \
            --body "$DESTROY_MINUTE"

          echo "Destroy schedule saved successfully."
          echo "Destroy UTC: $DESTROY_HOUR:$DESTROY_MINUTE"

      # ====================================================
      # VERIFY SAVED SCHEDULE
      # ====================================================
      - name: Verify Saved Schedule
        env:
          GH_TOKEN: ${{ secrets.GH_VARIABLE_TOKEN }}

        shell: bash

        run: |
          set -euo pipefail

          echo "Reading saved Terraform schedule..."

          APPLY_HOUR=$(
            gh variable get TERRAFORM_APPLY_HOUR \
              --repo "${{ github.repository }}"
          )

          APPLY_MINUTE=$(
            gh variable get TERRAFORM_APPLY_MINUTE \
              --repo "${{ github.repository }}"
          )

          DESTROY_HOUR=$(
            gh variable get TERRAFORM_DESTROY_HOUR \
              --repo "${{ github.repository }}"
          )

          DESTROY_MINUTE=$(
            gh variable get TERRAFORM_DESTROY_MINUTE \
              --repo "${{ github.repository }}"
          )

          echo ""
          echo "======================================"
          echo "Saved Terraform Schedule"
          echo "======================================"
          echo "Apply UTC   : $APPLY_HOUR:$APPLY_MINUTE"
          echo "Destroy UTC : $DESTROY_HOUR:$DESTROY_MINUTE"
          echo "Days        : Monday-Friday IST"
          echo "======================================"

  # ========================================================
  # TERRAFORM JOB
  # ========================================================
  terraform:
    name: Terraform

    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write
      actions: read

    env:
      TF_VAR_database_password: ${{ secrets.DATABASE_PASSWORD }}

    if: |
      github.event_name == 'schedule' ||
      (
        github.event_name == 'workflow_dispatch' &&
        (
          inputs.action == 'apply' ||
          inputs.action == 'destroy'
        )
      )

    steps:

      # ====================================================
      # CHECKOUT
      # ====================================================
      - name: Checkout
        uses: actions/checkout@v4

      # ====================================================
      # GET SAVED SCHEDULE
      # ====================================================
      - name: Get Terraform Schedule
        id: schedule

        if: github.event_name == 'schedule'

        env:
          GH_TOKEN: ${{ secrets.GH_VARIABLE_TOKEN }}

        shell: bash

        run: |
          set -euo pipefail

          echo "Reading Terraform schedule..."

          APPLY_HOUR=$(
            gh variable get TERRAFORM_APPLY_HOUR \
              --repo "${{ github.repository }}"
          )

          APPLY_MINUTE=$(
            gh variable get TERRAFORM_APPLY_MINUTE \
              --repo "${{ github.repository }}"
          )

          DESTROY_HOUR=$(
            gh variable get TERRAFORM_DESTROY_HOUR \
              --repo "${{ github.repository }}"
          )

          DESTROY_MINUTE=$(
            gh variable get TERRAFORM_DESTROY_MINUTE \
              --repo "${{ github.repository }}"
          )

          if [[ -z "$APPLY_HOUR" ||
                -z "$APPLY_MINUTE" ||
                -z "$DESTROY_HOUR" ||
                -z "$DESTROY_MINUTE" ]]; then
            echo "ERROR: Terraform schedule is not configured."
            echo "Run this workflow manually with action=configure."
            exit 1
          fi

          echo "Apply UTC   : $APPLY_HOUR:$APPLY_MINUTE"
          echo "Destroy UTC : $DESTROY_HOUR:$DESTROY_MINUTE"

          {
            echo "apply_hour=$APPLY_HOUR"
            echo "apply_minute=$APPLY_MINUTE"
            echo "destroy_hour=$DESTROY_HOUR"
            echo "destroy_minute=$DESTROY_MINUTE"
          } >> "$GITHUB_OUTPUT"

      # ====================================================
      # DETERMINE TERRAFORM ACTION
      # ====================================================
      - name: Determine Terraform Action
        id: action

        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_ACTION: ${{ inputs.action }}

          APPLY_HOUR: ${{ steps.schedule.outputs.apply_hour }}
          APPLY_MINUTE: ${{ steps.schedule.outputs.apply_minute }}

          DESTROY_HOUR: ${{ steps.schedule.outputs.destroy_hour }}
          DESTROY_MINUTE: ${{ steps.schedule.outputs.destroy_minute }}

        shell: bash

        run: |
          set -euo pipefail

          ACTION="none"

          # Manual execution
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            case "$MANUAL_ACTION" in
              apply)
                ACTION="apply"
                ;;
              destroy)
                ACTION="destroy"
                ;;
            esac
          fi

          # Scheduled execution
          if [[ "$EVENT_NAME" == "schedule" ]]; then
            CURRENT_UTC_HOUR=$((10#$(date -u +"%H")))
            CURRENT_UTC_MINUTE=$((10#$(date -u +"%M")))

            SAVED_APPLY_HOUR=$((10#$APPLY_HOUR))
            SAVED_APPLY_MINUTE=$((10#$APPLY_MINUTE))

            SAVED_DESTROY_HOUR=$((10#$DESTROY_HOUR))
            SAVED_DESTROY_MINUTE=$((10#$DESTROY_MINUTE))

            CURRENT_TOTAL=$(
              (CURRENT_UTC_HOUR * 60) + CURRENT_UTC_MINUTE
            )

            APPLY_TOTAL=$(
              (SAVED_APPLY_HOUR * 60) + SAVED_APPLY_MINUTE
            )

            DESTROY_TOTAL=$(
              (SAVED_DESTROY_HOUR * 60) + SAVED_DESTROY_MINUTE
            )

            # Check the weekday in IST, not UTC
            IST_DAY=$(TZ="Asia/Kolkata" date +"%u")
            IST_DATE=$(TZ="Asia/Kolkata" date +"%Y-%m-%d")
            IST_TIME=$(TZ="Asia/Kolkata" date +"%H:%M")

            echo "======================================"
            echo "Schedule Check"
            echo "======================================"
            echo "Current IST : $IST_DATE $IST_TIME"
            echo "IST day     : $IST_DAY"
            echo "Current UTC : $(date -u +"%H:%M")"
            echo "Apply UTC   : $APPLY_HOUR:$APPLY_MINUTE"
            echo "Destroy UTC : $DESTROY_HOUR:$DESTROY_MINUTE"
            echo "======================================"

            if (( IST_DAY >= 1 && IST_DAY <= 5 )); then
              APPLY_DELAY=$((CURRENT_TOTAL - APPLY_TOTAL))
              DESTROY_DELAY=$((CURRENT_TOTAL - DESTROY_TOTAL))

              # The cron runs every five minutes.
              # Allow a five-minute schedule window.
              if (( APPLY_DELAY >= 0 && APPLY_DELAY < 5 )); then
                ACTION="apply"
                echo "Apply schedule matched."
              elif (( DESTROY_DELAY >= 0 && DESTROY_DELAY < 5 )); then
                ACTION="destroy"
                echo "Destroy schedule matched."
              else
                echo "No scheduled Terraform action."
              fi
            else
              echo "Weekend in IST. No Terraform action."
            fi
          fi

          echo ""
          echo "======================================"
          echo "Terraform action: $ACTION"
          echo "======================================"

          echo "action=$ACTION" >> "$GITHUB_OUTPUT"

      # ====================================================
      # NO ACTION
      # ====================================================
      - name: No Action
        if: steps.action.outputs.action == 'none'

        run: |
          echo "No Terraform action scheduled."
          echo "Nothing to do."

      # ====================================================
      # SETUP TERRAFORM
      # ====================================================
      - name: Setup Terraform
        if: steps.action.outputs.action != 'none'

        uses: hashicorp/setup-terraform@v3

        with:
          terraform_version: 1.9.8

      # ====================================================
      # GCP AUTHENTICATION
      # ====================================================
      - name: Authenticate to GCP
        if: steps.action.outputs.action != 'none'

        uses: google-github-actions/auth@v3

        with:
          workload_identity_provider: >-
            projects/988805055079/locations/global/workloadIdentityPools/githubaction-wif/providers/github-actions

          service_account: >-
            github-actions-sa@ai-powered-invoice-507413.iam.gserviceaccount.com

      # ====================================================
      # SETUP GCLOUD
      # ====================================================
      - name: Setup gcloud
        if: steps.action.outputs.action != 'none'

        uses: google-github-actions/setup-gcloud@v3

      # ====================================================
      # PRIVATE TERRAFORM MODULE AUTHENTICATION
      # ====================================================
      - name: Configure Git Authentication
        if: steps.action.outputs.action != 'none'

        env:
          MODULE_GITHUB_TOKEN: ${{ secrets.MODULE_GITHUB_TOKEN }}

        run: |
          set -euo pipefail

          git config --global \
            url."https://${MODULE_GITHUB_TOKEN}@github.com/".insteadOf \
            "https://github.com/"

      # ====================================================
      # TERRAFORM FORMAT
      # ====================================================
      - name: Terraform Format
        if: steps.action.outputs.action != 'none'

        working-directory: ./environments/dev

        run: |
          terraform fmt -check

      # ====================================================
      # TERRAFORM INIT
      # ====================================================
      - name: Terraform Init
        if: steps.action.outputs.action != 'none'

        working-directory: ./environments/dev

        run: |
          terraform init -upgrade

      # ====================================================
      # TERRAFORM VALIDATE
      # ====================================================
      - name: Terraform Validate
        if: steps.action.outputs.action != 'none'

        working-directory: ./environments/dev

        run: |
          terraform validate

      # ====================================================
      # TERRAFORM APPLY PLAN
      # ====================================================
      - name: Terraform Apply Plan
        if: steps.action.outputs.action == 'apply'

        working-directory: ./environments/dev

        run: |
          terraform plan -out=tfplan

      # ====================================================
      # TERRAFORM APPLY
      # ====================================================
      - name: Terraform Apply
        if: steps.action.outputs.action == 'apply'

        working-directory: ./environments/dev

        run: |
          terraform apply -auto-approve tfplan

      # ====================================================
      # TERRAFORM DESTROY PLAN
      # ====================================================
      - name: Terraform Destroy Plan
        if: steps.action.outputs.action == 'destroy'

        working-directory: ./environments/dev

        run: |
          terraform plan -destroy -out=destroy.tfplan

      # ====================================================
      # TERRAFORM DESTROY
      # ====================================================
      - name: Terraform Destroy
        if: steps.action.outputs.action == 'destroy'

        working-directory: ./environments/dev

        run: |
          terraform apply -auto-approve destroy.tfplan
