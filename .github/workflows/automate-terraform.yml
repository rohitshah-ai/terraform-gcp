name: automate-Terraform

# ==========================================================
# WORKFLOW PERMISSIONS
# ==========================================================
permissions:
  contents: read
  id-token: write

# ==========================================================
# TRIGGER
# ==========================================================
on:
  workflow_dispatch:
    inputs:
      action:
        description: "Select Terraform action"
        required: true
        type: choice
        options:
          - apply
          - destroy
        default: apply

# ==========================================================
# AVOID SIMULTANEOUS TERRAFORM OPERATIONS
# ==========================================================
concurrency:
  group: terraform-dev
  cancel-in-progress: false

# ==========================================================
# JOB
# ==========================================================
jobs:

  terraform:
    name: Terraform
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    env:
      TF_VAR_database_password: ${{ secrets.DATABASE_PASSWORD }}

    steps:

      # ====================================================
      # CHECKOUT
      # ====================================================
      - name: Checkout
        uses: actions/checkout@v4

      # ====================================================
      # DETERMINE ACTION
      # ====================================================
      - name: Determine Terraform Action
        id: action
        env:
          MANUAL_ACTION: ${{ inputs.action }}

        shell: bash

        run: |
          set -euo pipefail

          echo "Selected Terraform action: $MANUAL_ACTION"

          case "$MANUAL_ACTION" in
            apply)
              echo "action=apply" >> "$GITHUB_OUTPUT"
              ;;
            destroy)
              echo "action=destroy" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "ERROR: Invalid Terraform action."
              exit 1
              ;;
          esac

      # ====================================================
      # SETUP TERRAFORM
      # ====================================================
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

        with:
          terraform_version: 1.9.8

      # ====================================================
      # GCP AUTHENTICATION
      # ====================================================
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v3

        with:
          workload_identity_provider: >-
            projects/988805055079/locations/global/workloadIdentityPools/githubaction-wif/providers/github-actions

          service_account: >-
            github-actions-sa@ai-powered-invoice-507413.iam.gserviceaccount.com

      # ====================================================
      # SETUP GCLOUD
      # ====================================================
      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v3

      # ====================================================
      # PRIVATE TERRAFORM MODULE AUTHENTICATION
      # ====================================================
      - name: Configure Git Authentication
        env:
          MODULE_GITHUB_TOKEN: ${{ secrets.MODULE_GITHUB_TOKEN }}

        run: |
          set -euo pipefail

          git config --global \
            url."https://${MODULE_GITHUB_TOKEN}@github.com/".insteadOf \
            "https://github.com/"

      # ====================================================
      # TERRAFORM FORMAT
      # ====================================================
      - name: Terraform Format
        working-directory: ./environments/dev

        run: |
          terraform fmt -check

      # ====================================================
      # TERRAFORM INIT
      # ====================================================
      - name: Terraform Init
        working-directory: ./environments/dev

        run: |
          terraform init -upgrade

      # ====================================================
      # TERRAFORM VALIDATE
      # ====================================================
      - name: Terraform Validate
        working-directory: ./environments/dev

        run: |
          terraform validate

      # ====================================================
      # TERRAFORM APPLY
      # ====================================================
      - name: Terraform Apply
        if: steps.action.outputs.action == 'apply'

        working-directory: ./environments/dev

        run: |
          set -euo pipefail

          echo "======================================"
          echo "Terraform Apply"
          echo "======================================"

          terraform plan -out=tfplan
          terraform apply -auto-approve tfplan

      # ====================================================
      # DELETE CLOUD RUN SERVICES
      #
      # ONLY RUNS DURING DESTROY
      # ====================================================
      - name: Delete Cloud Run Services
        if: steps.action.outputs.action == 'destroy'

        shell: bash

        run: |
          set -euo pipefail

          PROJECT_ID="ai-powered-invoice-507413"
          REGION="us-central1"

          echo "======================================"
          echo "Deleting Cloud Run Services"
          echo "======================================"

          for SERVICE in invoice-ui invoice-processor expense-service; do

            echo ""
            echo "Checking Cloud Run service: $SERVICE"

            if gcloud run services describe "$SERVICE" \
              --region="$REGION" \
              --project="$PROJECT_ID" \
              >/dev/null 2>&1; then

              echo "Deleting Cloud Run service: $SERVICE"

              gcloud run services delete "$SERVICE" \
                --region="$REGION" \
                --project="$PROJECT_ID" \
                --quiet

              echo "Deleted: $SERVICE"

            else

              echo "Service does not exist: $SERVICE"

            fi

          done

          echo ""
          echo "======================================"
          echo "Cloud Run cleanup completed"
          echo "======================================"

      # ====================================================
      # WAIT FOR CLOUD RUN NETWORKING RELEASE
      #
      # Gives Google time to release:
      # serverless-ipv4-cloudrun-*
      # ====================================================
      - name: Wait for Cloud Run Networking Release
        if: steps.action.outputs.action == 'destroy'

        shell: bash

        run: |
          set -euo pipefail

          echo "Waiting for Cloud Run serverless networking cleanup..."

          sleep 30

          echo "Cloud Run cleanup wait completed."

      # ====================================================
      # TERRAFORM DESTROY
      #
      # RUNS ONLY AFTER CLOUD RUN IS DELETED
      # ====================================================
      - name: Terraform Destroy
        if: steps.action.outputs.action == 'destroy'

        working-directory: ./environments/dev

        run: |
          set -euo pipefail

          echo "======================================"
          echo "Terraform Destroy"
          echo "======================================"

          terraform plan -destroy -out=destroy.tfplan

          terraform apply -auto-approve destroy.tfplan

          echo "======================================"
          echo "Terraform Destroy Completed"
          echo "======================================"
